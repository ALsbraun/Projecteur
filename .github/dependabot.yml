version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # Renovate exclusively owns the Fedora container image.
    allow:
      - dependency-name: actions/*
    groups:
      action-patches:
        update-types: [patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
